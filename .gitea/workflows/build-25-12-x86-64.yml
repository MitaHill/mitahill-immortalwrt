name: Build 25.12 AMD64

on:
  workflow_dispatch:
  push:
    branches:
      - 25.12
    paths:
      - .gitea/workflows/build-25-12-x86-64.yml
      - configs/x86-64.config
      - include/image.mk
      - scripts/prepare-integrated-sources.sh
      - scripts/build-bandix-from-source.sh
      - scripts/run-integrated-build.sh
      - scripts/verify-x86-firmware.py
      - assets/rootfs-expand/**
      - tests/**

permissions:
  code: read
  releases: write

jobs:
  firmware:
    if: ${{ gitea.ref == 'refs/heads/25.12' }}
    runs-on: ubuntu-latest
    timeout-minutes: 720
    container: node:22-bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            autoconf automake bison build-essential ccache clang cmake cpio curl file \
            flex g++-multilib gawk gcc-multilib genisoimage gettext git \
            libclang-dev libdw-dev libelf-dev libncurses5-dev libssl-dev lld llvm \
            patch pkg-config python3 python3-cryptography python3-distutils \
            python3-pyelftools qemu-utils qemu-system-x86 ovmf rsync subversion swig unzip wget \
            xz-utils zlib1g-dev zstd

      - name: Check out ImmortalWrt source
        uses: actions/checkout@v4

      - name: Verify source and prepare builder
        run: |
          grep -Fq 'VERSION_NUMBER:=$(if $(VERSION_NUMBER),$(VERSION_NUMBER),25.12.2)' include/version.mk
          test "$(uname -m)" = x86_64
          df -h .
          free -h
          useradd --create-home --shell /bin/bash build
          chown -R build:build .

      - name: Test integrated build and offline expansion logic
        run: python3 -m unittest discover -s tests -v

      - name: Build source packages and x86-64 firmware
        run: runuser -u build -- bash scripts/run-integrated-build.sh x86-64 25.12.2

      - name: Verify x86 firmware offline before publication
        run: python3 scripts/verify-x86-firmware.py bin/integrated-x86-64/immortalwrt-25.12.2-x86-64-passwall-bandix-ext4-combined-efi.img.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.2-x86-64-integrated
          path: |
            bin/targets/x86/64/*.img.gz
            bin/targets/x86/64/*.manifest
            bin/targets/x86/64/*.buildinfo
            bin/targets/x86/64/profiles.json
            bin/targets/x86/64/sha256sums
            bin/integrated-x86-64/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish Gitea release
        uses: https://gitea.com/actions/gitea-release-action@5a83c90484ef4355121df5eb60558c8ce66e81ac
        with:
          server_url: ${{ gitea.server_url }}
          token: ${{ secrets.GITEA_TOKEN }}
          tag_name: v25.12.2-x86-64-build.${{ gitea.run_number }}
          target_commitish: ${{ gitea.sha }}
          name: ImmortalWrt 25.12.2 x86-64 integrated build #${{ gitea.run_number }}
          body: |
            ImmortalWrt 25.12.2 x86/64 EFI firmware with PassWall and Bandix
            compiled from the upstream revisions in source-revisions.json.
            Verify the integrated files against the accompanying sha256sums.
          prerelease: true
          files: |
            bin/targets/x86/64/*.img.gz
            bin/targets/x86/64/*.manifest
            bin/targets/x86/64/*.buildinfo
            bin/targets/x86/64/profiles.json
            bin/targets/x86/64/sha256sums
            bin/integrated-x86-64/*
